name: Frontend CI Pipeline

# Trigger khi có push hoặc pull_request vào branch master
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Lấy code từ repository về runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Cài đặt môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Cài đặt dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Kiểm tra TypeScript / Lint (Tuỳ project của bạn có script gì)
      - name: Run Type Check
        run: npx tsc --noEmit

      # Step 5: Chạy thử Build Production
      - name: Build Project
        run: npm run build